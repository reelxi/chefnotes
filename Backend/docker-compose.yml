version: '3.9'
services:
  backend:
    container_name: chefnotes-backend
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - '3000:3000'
    environment:
      - NODE_ENV=development
    volumes:
      - .:/app
      - /app/node_modules
    command: sh -c "npm install && npm run seed && npm run start:dev"
    depends_on:
      - postgres

  postgres:
    image: postgres:15
    container_name: chefnotes-db
    restart: always
    environment:
      POSTGRES_DB: nestjs
      POSTGRES_USER: nestjs
      POSTGRES_PASSWORD: nestjs
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
